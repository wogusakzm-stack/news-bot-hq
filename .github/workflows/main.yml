name: 6-Hour News Bot

on:
  schedule:
    # 한국시간 기준 00:00, 06:00, 12:00, 18:00 실행
    # GitHub Actions cron은 UTC 기준
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TZ: 'Asia/Seoul'
          PYTHONUNBUFFERED: '1'
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GOV_API_KEY: ${{ secrets.GOV_API_KEY }}
          GOV_ENDPOINT: ${{ secrets.GOV_ENDPOINT }}
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python news_bot.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f seen_urls.json ]; then
            echo "seen_urls.json not found"
            exit 0
          fi

          # 이번 실행 결과를 임시 보관
          cp seen_urls.json /tmp/seen_urls.json

          # 원격 최신 main으로 작업트리 초기화
          git fetch origin main
          git reset --hard origin/main

          # 이번 실행 결과를 다시 덮어쓰기
          cp /tmp/seen_urls.json seen_urls.json

          git add seen_urls.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update seen news list [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}"

            if git push origin HEAD:main; then
              echo "Push success"
              exit 0
            fi

            echo "Push failed. Refreshing from origin/main and retrying..."

            cp seen_urls.json /tmp/seen_urls.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/seen_urls.json seen_urls.json

            git add seen_urls.json

            if git diff --cached --quiet; then
              echo "No changes after refresh"
              exit 0
            fi

            git commit -m "Update seen news list [skip ci]" || true
            sleep 3
          done

          echo "Push failed after 3 attempts"
          exit 1
